# GlazeWM: atajos calcados de niri (window-managers/niri/config.kdl) con Win como Mod.
# install.ps1 lo copia a %USERPROFILE%\.glzr\glazewm\config.yaml; tras editarlo,
# Win+Shift+R recarga.
#
# Win+L: Windows lo reserva para bloquear y no se puede capturar, así que
# install.ps1 desactiva el bloqueo (DisableLockWorkstation) y Win+Ctrl+L
# (como en niri) bloquea con lock.ps1, que lo reactiva un momento.
#
# Sin equivalente: Mod+D (no hay lanzador: Win suelto abre la búsqueda de Inicio y
# Win+D sigue siendo "mostrar escritorio"), Mod+Y (GoldenDict), consume/expel
# (Mod+Comma y Mod+Period cambian aquí la dirección del mosaico) y el overlay de atajos.
# Win+Space y Win+R pasan a GlazeWM: el idioma de entrada se cambia con Alt+Shift y
# el diálogo Ejecutar ya no tiene atajo.

general:
  startup_commands: ['shell-exec zebar']
  shutdown_commands: ['shell-exec taskkill /IM zebar.exe /F']
  config_reload_commands: []
  focus_follows_cursor: false
  toggle_workspace_on_refocus: false
  cursor_jump:
    enabled: true
    trigger: 'monitor_focus'
  hide_method: 'cloak'
  show_all_in_taskbar: false

gaps:
  scale_with_dpi: true
  inner_gap: '8px'
  outer_gap:
    # Arriba deja sitio a Zebar
    top: '40px'
    right: '8px'
    bottom: '8px'
    left: '8px'

window_effects:
  focused_window:
    border:
      enabled: true
      color: '#d79921'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: false
      style: 'square'
    transparency:
      enabled: false
      opacity: '95%'
  other_windows:
    border:
      enabled: true
      color: '#504945'
    hide_title_bar:
      enabled: false
    corner_style:
      enabled: false
      style: 'square'
    transparency:
      enabled: false
      opacity: '0%'

window_behavior:
  initial_state: 'tiling'
  state_defaults:
    floating:
      centered: true
      shown_on_top: false
    fullscreen:
      maximized: false
      shown_on_top: false

workspaces:
  - name: '1'
  - name: '2'
  - name: '3'
  - name: '4'
  - name: '5'
  - name: '6'
  - name: '7'
  - name: '8'
  - name: '9'

window_rules:
  - commands: ['ignore']
    match:
      - window_process: { equals: 'zebar' }
      # Picture-in-picture de los navegadores
      - window_title: { regex: '[Pp]icture.in.[Pp]icture' }
        window_class: { regex: 'Chrome_WidgetWin_1|MozillaDialogClass' }
      # Diálogos de Office (de la config de ejemplo de GlazeWM)
      - window_process: { equals: 'EXCEL' }
        window_class: { not_regex: 'XLMAIN' }
      - window_process: { equals: 'WINWORD' }
        window_class: { not_regex: 'OpusApp' }
      - window_process: { equals: 'POWERPNT' }
        window_class: { not_regex: 'PPTFrameClass' }

binding_modes:
  # Win+R: redimensionar con HJKL o flechas; Esc/Enter para salir
  - name: 'resize'
    keybindings:
      - commands: ['resize --width -2%']
        bindings: ['h', 'left']
      - commands: ['resize --width +2%']
        bindings: ['l', 'right']
      - commands: ['resize --height +2%']
        bindings: ['k', 'up']
      - commands: ['resize --height -2%']
        bindings: ['j', 'down']
      - commands: ['wm-disable-binding-mode --name resize']
        bindings: ['escape', 'enter', 'lwin+r']

keybindings:
  # Programas y sesión (Mod+Return, Mod+Shift+Q, Mod+Shift+E, Mod+Ctrl+L)
  - commands: ['shell-exec %ProgramFiles%\WezTerm\wezterm-gui.exe']
    bindings: ['lwin+enter']
  - commands: ['close']
    bindings: ['lwin+shift+q']
  - commands: ['wm-exit']
    bindings: ['lwin+shift+e']
  - commands: ['shell-exec --hide-window powershell -NoProfile -ExecutionPolicy Bypass -File %USERPROFILE%\.glzr\glazewm\lock.ps1']
    bindings: ['lwin+ctrl+l']
  - commands: ['wm-reload-config']
    bindings: ['lwin+shift+r']
  - commands: ['wm-enable-binding-mode --name resize']
    bindings: ['lwin+r']

  # Foco (Mod+H/J/K/L)
  - commands: ['focus --direction left']
    bindings: ['lwin+h', 'lwin+left']
  - commands: ['focus --direction right']
    bindings: ['lwin+l', 'lwin+right']
  - commands: ['focus --direction up']
    bindings: ['lwin+k', 'lwin+up']
  - commands: ['focus --direction down']
    bindings: ['lwin+j', 'lwin+down']

  # Mover (Mod+Shift+H/J/K/L)
  - commands: ['move --direction left']
    bindings: ['lwin+shift+h', 'lwin+shift+left']
  - commands: ['move --direction right']
    bindings: ['lwin+shift+l', 'lwin+shift+right']
  - commands: ['move --direction up']
    bindings: ['lwin+shift+k', 'lwin+shift+up']
  - commands: ['move --direction down']
    bindings: ['lwin+shift+j', 'lwin+shift+down']

  # Mod+Comma/Period: en niri meten/sacan ventanas de la columna; aquí cambian
  # si la siguiente ventana se apila en vertical u horizontal
  - commands: ['toggle-tiling-direction']
    bindings: ['lwin+oem_comma', 'lwin+oem_period']

  # Mod+M maximizar, Mod+F / Mod+Shift+F pantalla completa, Mod+Space flotante
  - commands: ['toggle-fullscreen --maximized']
    bindings: ['lwin+m']
  - commands: ['toggle-fullscreen --maximized=false']
    bindings: ['lwin+f', 'lwin+shift+f']
  - commands: ['toggle-floating --centered']
    bindings: ['lwin+space']

  # Workspaces (Mod+1…9, Mod+Shift+1…9)
  - commands: ['focus --workspace 1']
    bindings: ['lwin+1']
  - commands: ['focus --workspace 2']
    bindings: ['lwin+2']
  - commands: ['focus --workspace 3']
    bindings: ['lwin+3']
  - commands: ['focus --workspace 4']
    bindings: ['lwin+4']
  - commands: ['focus --workspace 5']
    bindings: ['lwin+5']
  - commands: ['focus --workspace 6']
    bindings: ['lwin+6']
  - commands: ['focus --workspace 7']
    bindings: ['lwin+7']
  - commands: ['focus --workspace 8']
    bindings: ['lwin+8']
  - commands: ['focus --workspace 9']
    bindings: ['lwin+9']

  - commands: ['move --workspace 1']
    bindings: ['lwin+shift+1']
  - commands: ['move --workspace 2']
    bindings: ['lwin+shift+2']
  - commands: ['move --workspace 3']
    bindings: ['lwin+shift+3']
  - commands: ['move --workspace 4']
    bindings: ['lwin+shift+4']
  - commands: ['move --workspace 5']
    bindings: ['lwin+shift+5']
  - commands: ['move --workspace 6']
    bindings: ['lwin+shift+6']
  - commands: ['move --workspace 7']
    bindings: ['lwin+shift+7']
  - commands: ['move --workspace 8']
    bindings: ['lwin+shift+8']
  - commands: ['move --workspace 9']
    bindings: ['lwin+shift+9']
